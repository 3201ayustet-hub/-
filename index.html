<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poker Telop Maker</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Transparent PNG Generator</p>
        <h1>ポーカーショート用<br />背景透過テロップメーカー</h1>
        <p class="lead">文字・雰囲気・色を選ぶだけで、動画編集に使える透過PNGを作成できます。</p>
      </div>
      <div class="hero-actions">
        <button id="downloadBtn" class="primary">PNG保存</button>
        <button id="copyBtn" class="ghost">設定コピー</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel controls">
        <h2>テロップ設定</h2>

        <label>テキスト</label>
        <textarea id="textInput" spellcheck="false">ロクヤマ、オールイン</textarea>

        <div class="two">
          <div>
            <label>雰囲気</label>
            <select id="presetSelect"></select>
          </div>
          <div>
            <label>比率</label>
            <select id="sizePreset">
              <option value="wide">横長 1600×520</option>
              <option value="shorts">Shorts 1080×360</option>
              <option value="square">正方形 1200×500</option>
              <option value="custom">カスタム</option>
            </select>
          </div>
        </div>

        <div class="two custom-size">
          <div>
            <label>幅</label>
            <input id="canvasW" type="number" value="1600" />
          </div>
          <div>
            <label>高さ</label>
            <input id="canvasH" type="number" value="520" />
          </div>
        </div>

        <div class="two">
          <div>
            <label>文字サイズ</label>
            <input id="fontSize" type="range" min="50" max="220" value="140" />
          </div>
          <div>
            <label>傾き</label>
            <input id="tilt" type="range" min="-12" max="12" value="-3" />
          </div>
        </div>

        <div class="two">
          <div>
            <label>メイン色</label>
            <input id="mainColor" type="color" value="#ff2a18" />
          </div>
          <div>
            <label>強調色</label>
            <input id="accentColor" type="color" value="#ffe45c" />
          </div>
        </div>

        <label>ワード別カラー</label>
        <input id="wordRules" value="ロクヤマ:#ff2a18,相手:#5cecff,76,000:#ffe45c,オールイン:#ffe45c,J:#ff2a18,フラッシュ:#6adfff,負け:#ff2b7a" />
        <p class="hint">例：ロクヤマ:#ff0000,76,000:#ffff00,ベット:#00d9ff</p>

        <div class="quick">
          <button data-text="ロクヤマ、2,400点のレイズ" data-preset="raise">レイズ</button>
          <button data-text="相手がコール" data-preset="cool">コール</button>
          <button data-text="ロクヤマ、Jのセットが完成" data-preset="gold">セット</button>
          <button data-text="相手、76,000点ベット" data-preset="cool">相手ベット</button>
          <button data-text="ロクヤマ、オールイン" data-preset="fire">オールイン</button>
          <button data-text="相手がフラッシュで負け" data-preset="danger">敗北</button>
        </div>
      </section>

      <section class="panel preview-panel">
        <div class="preview-head">
          <h2>プレビュー</h2>
          <span>市松模様は確認用。PNG保存時は透明です。</span>
        </div>
        <div class="preview-bg">
          <canvas id="telopCanvas"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
